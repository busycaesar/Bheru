version: 2

project_name: bheru

before:
  hooks:
    - go mod tidy

builds:
  - id: bheru
    main: ./cmd/bheru
    binary: bheru
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: bheru
    binaries:
      - bheru
    repository:
      owner: busycaesar
      name: homebrew-bheru
    homepage: "https://github.com/busycaesar/bheru"
    description: "Distribute AI skill files to Claude Code"
    # Strip the macOS quarantine attribute on install so that the
    # unsigned/un-notarized binary isn't blocked by Gatekeeper.
    # Remove this hook once the binary is properly signed and notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bheru"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
